<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StudyQuest</title><meta name="theme-color" content="#5b5bf0">
<style>
:root{--bg:#f4f5fb;--card:#fff;--tx:#1d2140;--mu:#6b7194;--ac:#5b5bf0;--ac2:#8b5cf6;--ok:#16a34a;--wa:#f59e0b;--bd:#e4e6f2;--bad:#e11d48;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1120;--card:#1a1d35;--tx:#eceefd;--mu:#9096bd;--bd:#2a2e50}}
:root[data-theme="dark"]{--bg:#0f1120;--card:#1a1d35;--tx:#eceefd;--mu:#9096bd;--bd:#2a2e50}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:16px 14px 90px}
h1,h2,h3{margin:0}h2{font-size:18px;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin:10px 0}
.hero{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0}
.hero small{opacity:.85}.big{font-size:26px;font-weight:800}
.bar{height:8px;background:rgba(255,255,255,.3);border-radius:9px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:#fff}
.row{display:flex;gap:10px;align-items:center}.sp{justify-content:space-between}.g{flex:1}
input,select{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;margin:4px 0}
button{font:inherit;border:0;border-radius:12px;padding:10px 14px;background:var(--ac);color:#fff;font-weight:600;cursor:pointer}
button.s{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}button.ok{background:var(--ok)}button.bad{background:var(--bad)}
button.sm{padding:6px 10px;font-size:13px}button:disabled{opacity:.5}
.mu{color:var(--mu);font-size:13px}.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--bg);border:1px solid var(--bd)}
.tag.ok{color:var(--ok)}.tag.wa{color:var(--wa)}.tag.bad{color:var(--bad)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{display:flex;max-width:560px;width:100%}nav button{flex:1;background:none;color:var(--mu);border-radius:0;padding:12px 4px;font-size:13px}nav button.on{color:var(--ac)}
.pts{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.pts button{padding:6px 0;width:34px;background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0}.chips button{white-space:nowrap}
.tabs{display:flex;gap:6px;margin:12px 0}.tabs button{flex:1}
.day{border-left:4px solid var(--ac);padding-left:10px;margin:10px 0}.day.t{border-color:var(--ok)}
.toast{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:99px;z-index:9;font-size:14px}
</style></head><body><main id="app"><p class="mu">Loading…</p></main>
<script>
const DAYS=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const READ=["📚 Weekly revision / pending schoolwork","📖 English — read + revise daily work","📖 Sanskrit — read + revise daily work","📖 Science — read + revise daily work","📖 Social Science — read + revise daily work","📖 English — reading + school revision","📖 Science — reading + school revision"];
const EVE=["➗ Maths — concepts + practice","📝 Homework/Pending → 🏅 Olympiad → MCQs","📝 Homework/Pending → 🇮🇳 Sanskrit → 🏆 Competition → MCQs","📝 Homework/Pending → 🏅 Olympiad → MCQs","📝 Homework/Pending → 🌍 Social Science → 🏆 Competition → MCQs","📝 Homework/Pending → 🏅 Olympiad → MCQs","📝 Homework/Pending → 🔬 Science → 🏆 Competition → MCQs"];
const SLOTS=d=>[{id:"a",time:"2:30–3:30 PM",name:READ[d]},{id:"b",time:"7:30 PM",name:EVE[d]}];
const GRADES=[[0,"Novice","🌱"],[30,"Learner","📘"],[60,"Achiever","⭐"],[90,"Scholar","🎓"],[120,"Champion","🏆"]];
const MAXW=140;
let db,fam=null,sess=null,tab="",kid=null,ui={};
const $=s=>document.querySelector(s),app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0"),ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const mon=d=>addD(d,-((d.getDay()+6)%7));
const today=()=>ymd(new Date());
const parse=s=>{const[a,b,c]=s.split("-");return new Date(+a,b-1,+c)};
async function hash(p,salt){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(salt+":"+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
const LS={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const fbUrl=()=>(LS.get("sqfb")??"https://studyquest-b6469-default-rtdb.firebaseio.com").replace(/\/+$/,"");
async function load(c){const u=fbUrl();if(u){const r=await fetch(u+"/fam/"+c+".json");if(!r.ok)throw 0;return await r.json()}const t=LS.get("sqfam_"+c);return t?JSON.parse(t):null}
async function put(c,d){const u=fbUrl();if(u){const r=await fetch(u+"/fam/"+c+".json",{method:"PUT",body:JSON.stringify(d)});if(!r.ok)throw 0}else LS.set("sqfam_"+c,JSON.stringify(d))}
const ref=c=>({async get(){const d=await load(c);return{exists:!!d,data:()=>d}},async set(d){await put(c,d)},
onSnapshot(cb){let last="";const t=setInterval(async()=>{try{const d=await load(c);const j=JSON.stringify(d);if(j!==last){last=j;cb({exists:!!d,data:()=>d})}}catch(e){}},4000);return()=>clearInterval(t)}});
let unsub=null,saving=0;
async function save(){saving++;try{await ref(sess.code).set(JSON.parse(JSON.stringify(fam)))}catch(e){toast("Save failed")}saving--}
function listen(){unsub&&unsub();unsub=ref(sess.code).onSnapshot(s=>{if(!s.exists||saving)return;fam=s.data();const a=document.activeElement;if(a&&a.tagName==="INPUT"&&a.value)return;render()})}
function store(){try{localStorage.setItem("sq",JSON.stringify(sess))}catch(e){}}
function K(id){return fam.kids[id]}
function wkPts(k,d0){let t=0;for(let i=0;i<7;i++){const ds=ymd(addD(d0,i));for(const s of["a","b"]){const e=k.log?.[ds+s];if(e&&e.p!=null)t+=e.p}}return t}
function grade(p){let g=GRADES[0];for(const x of GRADES)if(p>=x[0])g=x;const n=GRADES[GRADES.indexOf(g)+1];return{g,n}}
function onLeave(k,ds){return (k.leaves||[]).some(l=>l.date===ds&&l.status!=="declined")}
function bal(k){return k.money||0}
function addLedger(k,t,amt){k.ledger=[{t,amt,d:today()},...(k.ledger||[])].slice(0,30)}

/* ---------- auth ---------- */
function authView(){
const m=ui.mode||"login";
if(m==="setup")return`<h2>⚙ Sync settings</h2><div class="card"><p class="mu">Leave empty to keep data on <b>this device only</b>. To sync parent, student and siblings across devices, paste your Firebase Realtime Database URL (free). Every device must use the same URL.</p><input id="fb" placeholder="https://yourproject-default-rtdb.firebaseio.com" value="${esc(fbUrl())}"><button style="width:100%" data-a="fbsave">Save</button></div><button class="s" style="width:100%" data-a="mode" data-v="login">Back</button>`;
if(m==="login")return`<div style="text-align:center;margin:26px 0"><div style="font-size:44px">🎯</div><h1>StudyQuest</h1><p class="mu">Study. Report. Earn. Level up.</p></div>
<div class="card"><h3>Log in</h3><input id="lc" placeholder="Family code (e.g. AB12CD)" autocapitalize="characters"><select id="lr"><option value="parent">I'm a Parent</option><option value="student">I'm a Student</option></select><input id="ln" placeholder="Your name"><input id="lp" type="password" placeholder="Password"><button class="g" style="width:100%;margin-top:6px" data-a="login">Log in</button></div>
<button class="s" style="width:100%" data-a="mode" data-v="signup">Create a new family</button><button class="s sm" style="width:100%;margin-top:8px" data-a="mode" data-v="setup">⚙ Sync settings (${fbUrl()?"cloud":"this device only"})</button>`;
return`<h2>Create family</h2><p class="mu">Set up a linked parent + student account, each with their own password. Add siblings later.</p>
<div class="card"><h3>👨‍👩‍👧 Parent</h3><input id="pn" placeholder="Parent name"><input id="pp" type="password" placeholder="Parent password"></div>
<div class="card"><h3>🎒 Student</h3><input id="sn" placeholder="Student name"><input id="sp" type="password" placeholder="Student password"></div>
<button style="width:100%" data-a="signup">Create accounts</button><button class="s" style="width:100%;margin-top:8px" data-a="mode" data-v="login">Back to log in</button>`}
async function doSignup(){
const pn=$("#pn").value.trim(),pp=$("#pp").value,sn=$("#sn").value.trim(),sp=$("#sp").value;
if(!pn||!sn||pp.length<4||sp.length<4)return toast("Fill all fields (passwords 4+ chars)");
let code,tries=0;do{code=Array.from({length:6},()=>"ABCDEFGHJKMNPQRSTUVWXYZ23456789"[Math.random()*31|0]).join("");tries++}while((await ref(code).get()).exists&&tries<5);
const kid="k"+Date.now().toString(36);
fam={parent:{name:pn,h:await hash(pp,code)},leaveCost:100,kids:{[kid]:{name:sn,h:await hash(sp,code),log:{},money:0,ledger:[],leaves:[]}}};
await ref(code).set(fam);sess={code,role:"parent",id:"p"};store();ui.new=code;listen();boot()}
async function doLogin(){
const code=$("#lc").value.trim().toUpperCase(),role=$("#lr").value,n=$("#ln").value.trim().toLowerCase(),p=$("#lp").value;
const s=await ref(code).get();if(!s.exists)return toast("Family not found");
const f=s.data(),h=await hash(p,code);let id=null;
if(role==="parent"){if(f.parent.name.toLowerCase()===n&&f.parent.h===h)id="p"}
else for(const[k,v]of Object.entries(f.kids))if(v.name.toLowerCase()===n&&v.h===h)id=k;
if(!id)return toast("Wrong name or password");
fam=f;sess={code,role,id};store();listen();boot()}
function boot(){tab=sess.role==="parent"?"review":"today";kid=sess.role==="student"?sess.id:Object.keys(fam.kids)[0];render()}

/* ---------- shared views ---------- */
function gradeCard(k){const d0=mon(new Date()),p=wkPts(k,d0),{g,n}=grade(p);
const pc=n?Math.round((p-g[0])/(n[0]-g[0])*100):100;
return`<div class="card hero"><small>This week · ${esc(k.name)}</small><div class="row sp"><div class="big">${g[2]} ${g[1]}</div><div class="big">${p}<small> pts</small></div></div><div class="bar"><i style="width:${pc}%"></i></div><small>${n?`${n[0]-p} pts to ${n[2]} ${n[1]}`:"Top grade reached! 🎉"}</small></div>`}
function weekView(k){const d0=mon(new Date());let h="<h2>📅 This week's timetable</h2>";
for(let i=0;i<7;i++){const d=addD(d0,i),ds=ymd(d),lv=onLeave(k,ds);
h+=`<div class="card day ${ds===today()?"t":""}"><b>${DAYS[d.getDay()]}</b> <span class="mu">${ds.slice(5)}</span>${lv?' <span class="tag wa">🏖 Leave</span>':""}`;
if(!lv)for(const s of SLOTS(d.getDay())){const e=k.log?.[ds+s.id];
h+=`<div class="row sp" style="margin-top:6px"><div><div class="mu">${s.time}</div>${s.name}</div>${e?(e.p!=null?`<span class="tag ok">${e.p}/10</span>`:`<span class="tag wa">Awaiting</span>`):`<span class="tag">–</span>`}</div>`}
h+="</div>"}return h}

/* ---------- student ---------- */
function studentView(){const k=K(sess.id);if(!k)return"<p>Account removed.</p>";let h=gradeCard(k);
if(tab==="today"){const d=new Date(),ds=today();h+=`<h2>Today · ${DAYS[d.getDay()]}</h2>`;
if(onLeave(k,ds))h+=`<div class="card">🏖 You're on approved leave today. Enjoy!</div>`;
else for(const s of SLOTS(d.getDay())){const e=k.log?.[ds+s.id];
h+=`<div class="card"><div class="mu">${s.time}</div><div style="margin:4px 0 10px">${s.name}</div>${e?.p!=null?`<span class="tag ok">✅ Parent gave ${e.p}/10</span>`:e?`<div class="row sp"><span class="tag wa">⏳ Sent to parent</span><button class="s sm" data-a="undo" data-s="${s.id}">Undo</button></div>`:`<button data-a="done" data-s="${s.id}">I finished this ✔</button>`}</div>`}}
if(tab==="week")h+=weekView(k);
if(tab==="shop"){const c=fam.leaveCost;h+=`<div class="card"><div class="row sp"><div><div class="mu">Your money</div><div class="big">₹${bal(k)}</div></div><div class="mu">Leave costs ₹${c}</div></div><input type="date" id="ld" min="${today()}" value="${today()}"><button style="width:100%" data-a="buy" ${bal(k)<c?"disabled":""}>🏖 Buy leave approval</button>${bal(k)<c?`<p class="mu">Earn ₹${c-bal(k)} more to afford a leave.</p>`:""}</div>
<h2>My leaves</h2>${(k.leaves||[]).slice().reverse().map(l=>`<div class="card row sp"><span>${l.date}</span><span class="tag ${l.status==="approved"?"ok":l.status==="declined"?"bad":"wa"}">${l.status==="pending"?"Awaiting parent":l.status}</span></div>`).join("")||'<p class="mu">None yet.</p>'}
<h2>History</h2>${(k.ledger||[]).map(l=>`<div class="row sp mu"><span>${esc(l.t)} · ${l.d}</span><b style="color:var(${l.amt<0?"--bad":"--ok"})">${l.amt<0?"−":"+"}₹${Math.abs(l.amt)}</b></div>`).join("")||'<p class="mu">No transactions.</p>'}`}
return h}

/* ---------- parent ---------- */
function parentView(){const ids=Object.keys(fam.kids);if(!K(kid))kid=ids[0];const k=K(kid);
let h=ui.new?`<div class="card">🔑 Family code: <b style="font-size:20px">${ui.new}</b><p class="mu" style="margin:4px 0 0">Share with your child to log in on their device. Open this same app link there.</p></div>`:"";
h+=`<div class="chips">${ids.map(i=>`<button class="${i===kid?"":"s"} sm" data-a="kid" data-v="${i}">🎒 ${esc(K(i).name)}</button>`).join("")}</div>`+gradeCard(k);
if(tab==="review"){const items=[];for(const[key,e]of Object.entries(k.log||{})){if(e.p==null)items.push(key)}
items.sort().reverse();h+=`<h2>To review (${items.length})</h2>`;
for(const key of items){const ds=key.slice(0,10),sid=key[10],s=SLOTS(parse(ds).getDay()).find(x=>x.id===sid);
h+=`<div class="card"><b>${DAYS[parse(ds).getDay()]} ${ds.slice(5)}</b> <span class="mu">${s.time}</span><div>${s.name}</div><div class="pts">${[...Array(11).keys()].map(n=>`<button data-a="pts" data-k="${key}" data-v="${n}">${n}</button>`).join("")}</div><p class="mu" style="margin:6px 0 0">Tap points out of 10</p></div>`}
if(!items.length)h+=`<div class="card mu">All caught up ✨ Nothing waiting.</div>`}
if(tab==="week")h+=weekView(k);
if(tab==="money"){const lv=(k.leaves||[]).filter(l=>l.status==="pending");
h+=`<div class="card"><div class="mu">Balance</div><div class="big">₹${bal(k)}</div><div class="row"><input id="am" type="number" placeholder="Amount ₹" min="1"><button data-a="pay">Add</button></div></div>
<h2>Leave requests</h2>${lv.map(l=>`<div class="card"><b>${l.date}</b> <span class="mu">paid ₹${l.cost}</span><div class="row" style="margin-top:8px"><button class="ok g" data-a="lv" data-id="${l.id}" data-v="approved">Approve</button><button class="bad g" data-a="lv" data-id="${l.id}" data-v="declined">Decline & refund</button></div></div>`).join("")||'<p class="mu">No pending requests.</p>'}`}
if(tab==="fam")h+=`<div class="card"><h3>Add sibling</h3><input id="bn" placeholder="Sibling name"><input id="bp" type="password" placeholder="Password"><button style="width:100%" data-a="sib">Create account</button></div>
<div class="card"><h3>Leave price (₹)</h3><div class="row"><input id="lcst" type="number" value="${fam.leaveCost}"><button data-a="cost">Save</button></div></div>
<div class="card mu">Family code: <b>${sess.code}</b><br>Grades per week: ${GRADES.map(g=>`${g[2]} ${g[1]} ${g[0]}+`).join(" · ")}</div>`;
return h}

/* ---------- render ---------- */
function render(){
if(!fam){app.innerHTML=authView();return}
const p=sess.role==="parent",tabs=p?[["review","📝","Review"],["week","📅","Week"],["money","💰","Money"],["fam","👨‍👩‍👧","Family"]]:[["today","🎯","Today"],["week","📅","Timetable"],["shop","🏖","Rewards"]];
app.innerHTML=`<div class="row sp"><b>${p?"Parent":"Student"} · ${esc(p?fam.parent.name:K(sess.id)?.name)}</b><button class="s sm" data-a="out">Log out</button></div>`+(p?parentView():studentView())+`<nav><div>${tabs.map(t=>`<button class="${tab===t[0]?"on":""}" data-a="tab" data-v="${t[0]}">${t[1]}<br>${t[2]}</button>`).join("")}</div></nav>`}

document.addEventListener("click",async e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,v=b.dataset.v;
if(a==="mode"){ui.mode=v;return render()}
if(a==="fbsave"){LS.set("sqfb",$("#fb").value.trim());toast("Saved");ui.mode="login";return render()}
if(a==="signup")return doSignup();if(a==="login")return doLogin();
if(a==="tab"){tab=v;return render()}if(a==="kid"){kid=v;return render()}
if(a==="out"){unsub&&unsub();try{localStorage.removeItem("sq")}catch(x){}fam=null;sess=null;ui={};return render()}
const k=K(kid);
if(a==="done"){k.log=k.log||{};k.log[today()+b.dataset.s]={d:1,p:null}}
else if(a==="undo"){delete k.log[today()+b.dataset.s]}
else if(a==="pts"){k.log[b.dataset.k].p=+v;toast("Points saved")}
else if(a==="pay"){const n=Math.round(+$("#am").value);if(!(n>0))return toast("Enter amount");k.money=bal(k)+n;addLedger(k,"From parent",n);toast("₹"+n+" added")}
else if(a==="buy"){const c=fam.leaveCost,d=$("#ld").value;if(!d||bal(k)<c)return;if((k.leaves||[]).some(l=>l.date===d&&l.status!=="declined"))return toast("Already booked");
k.money=bal(k)-c;addLedger(k,"Leave "+d,-c);k.leaves=[...(k.leaves||[]),{id:"l"+Date.now(),date:d,status:"pending",cost:c}];toast("Request sent!")}
else if(a==="lv"){const l=k.leaves.find(x=>x.id===b.dataset.id);l.status=v;if(v==="declined"){k.money=bal(k)+l.cost;addLedger(k,"Refund "+l.date,l.cost)}}
else if(a==="sib"){const n=$("#bn").value.trim(),p=$("#bp").value;if(!n||p.length<4)return toast("Name + 4+ char password");
const id="k"+Date.now().toString(36);fam.kids[id]={name:n,h:await hash(p,sess.code),log:{},money:0,ledger:[],leaves:[]};kid=id;tab="review";toast("Sibling added")}
else if(a==="cost"){fam.leaveCost=Math.max(1,Math.round(+$("#lcst").value)||100);toast("Saved")}
else return;
render();save()});
(async()=>{
let s=null;try{s=JSON.parse(localStorage.getItem("sq"))}catch(e){}
if(s){try{const d=await ref(s.code).get();if(d.exists&&(s.role==="parent"||d.data().kids[s.id])){sess=s;fam=d.data();listen();return boot()}}catch(e){}}
render()})();
</script></body></html>
